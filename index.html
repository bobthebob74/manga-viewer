<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <!-- メールアドレスなどを iPhone が自動でリンク（下線）にしないようにする -->
  <meta name="format-detection" content="telephone=no, email=no, address=no, date=no">
  <meta name="theme-color" content="#1b5596">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="マンガ">
  <title>マンガビューア</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css?v=30">
</head>
<body>
  <!-- 本棚 / ファイル選択 -->
  <section id="shelf" class="screen">
    <button id="btn-back" class="back-button" type="button" hidden>◀&#xFE0E; 戻る</button>
    <h1>マンガビューア</h1>
    <label class="open-button">
      PDFを開く
      <input type="file" id="file-input" accept="application/pdf,.pdf" hidden>
    </label>
    <p class="hint">PCではPDFをこの画面にドラッグしても開けます</p>
    <p id="shelf-error" class="error" hidden></p>

    <div id="recent" class="shelf-section" hidden>
      <h2>最近読んだ本</h2>
      <ul id="recent-list" class="book-list"></ul>
      <p class="hint">端末から開いたPDFは最近の5冊まで、Google Drive からダウンロードした本は削除するまで端末に残ります</p>
    </div>

    <div id="drive" class="shelf-section">
      <div class="section-head">
        <h2>Google Drive</h2>
        <button id="drive-signout" class="small-button" type="button" hidden>ログアウト</button>
      </div>
      <p id="drive-account" class="account-chip" hidden></p>
      <p id="drive-status" class="hint"></p>
      <p id="drive-error" class="error" hidden></p>
      <button id="drive-signin" class="secondary-button" type="button" hidden></button>
      <nav id="drive-path" class="breadcrumb" hidden></nav>
      <ul id="drive-list" class="book-list"></ul>
    </div>

    <p id="storage-info" class="version"></p>
    <p class="version">v30</p>
  </section>

  <!-- 閲覧画面 -->
  <section id="viewer" class="screen" hidden>
    <div id="stage"><div id="pages"></div></div>
    <div id="loading" hidden>読み込み中…</div>
    <div id="toast" hidden></div>

    <header id="topbar" class="bar">
      <button id="btn-close" type="button">◀&#xFE0E; 本棚</button>
      <span id="book-title"></span>
      <button id="btn-settings" type="button">設定</button>
    </header>
    <footer id="bottombar" class="bar">
      <input type="range" id="page-slider" min="1" max="1" value="1">
      <span id="page-indicator">1 / 1</span>
    </footer>
  </section>

  <!-- 設定 -->
  <dialog id="settings">
    <form method="dialog">
      <h2>設定</h2>
      <fieldset>
        <legend>綴じ方向</legend>
        <label><input type="radio" name="binding" value="rtl"> 右綴じ（マンガ）</label>
        <label><input type="radio" name="binding" value="ltr"> 左綴じ</label>
      </fieldset>
      <fieldset id="layout-setting">
        <legend>表示モード</legend>
        <label><input type="radio" name="layout" value="single"> 単ページ</label>
        <label><input type="radio" name="layout" value="spread"> 見開き</label>
        <label class="sub"><input type="checkbox" name="coverSingle"> 表紙（1ページ目）を単独で表示</label>
      </fieldset>
      <p id="layout-note" class="note" hidden>この画面幅では単ページで表示します</p>
      <button type="submit">閉じる</button>
    </form>
  </dialog>

  <script type="module" src="app.js?v=30"></script>
</body>
</html>
